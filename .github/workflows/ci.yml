name: CI

# configurations builds and tests every configuration of the build options,
# with gcc and clang; warnings builds with -Werror; format checks the C
# sources with clang-format. build makes a release build once per target,
# runs the regression tests in the build tree and uploads the installation
# as an archive; test unpacks that archive on a separate runner, without a
# build tree, and runs the regression tests on it; build-windows and
# test-windows do the same for Windows, with native Windows programs only;
# sdist makes the source distribution; commits checks the commit messages of
# a PR; ci-ok is the one check that the ruleset requires; release publishes
# the tested archives and the source distribution when the head of main is
# a release commit, made by `mise run release-pr`. Nothing is rebuilt after
# testing.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  configurations:
    # Every configuration the feature options make: the default, each option
    # on its own, and all of them together.  The default build alone is not
    # enough: an option nothing runs rots.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build bison libreadline-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja bison readline

      - name: Build and test every configuration
        env:
          CC: ${{ matrix.cc }}
        run: |
          # bison from Homebrew is not on PATH by default, and the one macOS
          # ships is too old for the grammar.
          if [ "$RUNNER_OS" = macOS ]; then
            PATH="$(brew --prefix bison)/bin:$PATH"
            export PATH
          fi
          tools/check-configurations

  warnings:
    # The tree builds without a compiler warning; -Werror says so rather
    # than leaving it to be noticed in a log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build bison libreadline-dev
      - run: meson setup build --werror
      - run: ninja -C build
      - run: meson test -C build

  format:
    # The C sources are formatted by clang-format.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: clang-format --dry-run -Werror src/*.c src/*.h src/prims/*.c src/prims/*.h

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.build-runner }}

    strategy: &strategy
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
        include:
          # Linux builds run on the oldest runner, as the binaries need a
          # glibc at least as new as the one they were built with.
          - target: x86_64-linux
            build-runner: ubuntu-22.04
            test-runner: ubuntu-latest
          - target: aarch64-linux
            build-runner: ubuntu-22.04-arm
            test-runner: ubuntu-24.04-arm
          - target: x86_64-macos
            build-runner: macos-15-intel
            test-runner: macos-15-intel
          - target: aarch64-macos
            build-runner: macos-15
            test-runner: macos-latest

    env:
      # The oldest macOS the binaries run on.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      # The libedit linked into the Linux binaries; see below.
      LIBEDIT: libedit-20260512-3.1
      LIBEDIT_SHA256: 432d5e7ea8b0116dd39f2eca7bc11d0eed77faa6b77ea526ace89907c23ea4a0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Line editing comes from libedit, which is BSD-licensed like Cupid,
      # not from GNU readline, whose GPL would cover the binaries. Without
      # libreadline-dev, meson falls back to libedit. Ubuntu 22.04's meson
      # is older than the 1.1 that meson.build needs, and its GCC 11 is not
      # a C23 compiler (bool, true and false are not keywords before GCC
      # 13), so GCC 13 comes from the Ubuntu toolchain PPA. The binaries
      # still need only the glibc of 22.04. GCC 13 is made the system gcc
      # rather than named in CC, because meson bakes the compiler command
      # into fficupid, and the users of the archive have a gcc but rarely
      # a gcc-13.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get remove -y libreadline-dev libedit-dev || true
          sudo apt-get install -y gcc-13 ninja-build bison libncurses-dev python3-pip
          sudo ln -sf gcc-13 /usr/bin/gcc
          python3 -m pip install --user meson==1.5.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CC=gcc" >> "$GITHUB_ENV"

      # libedit is linked statically, from upstream's source rather than
      # Ubuntu's package: Ubuntu's libedit.so.2 is a Debian soname that no
      # other distribution has (upstream's is libedit.so.0), and Ubuntu's
      # static library would pull in libbsd. libtinfo is linked statically
      # with it, because distributions build it with and without symbol
      # versions and the dynamic loader warns at every start when they
      # differ. The built libedit is cached by version and architecture, so
      # it is downloaded and built again only when the version changes.
      - name: Restore libedit (Linux)
        if: runner.os == 'Linux'
        id: libedit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libedit
          key: ${{ env.LIBEDIT }}-${{ env.LIBEDIT_SHA256 }}-${{ runner.os }}-${{ runner.arch }}-static

      - name: Build libedit (Linux)
        if: runner.os == 'Linux' && steps.libedit.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          # A small site; one runner has failed to connect at all. Retry
          # for a few minutes before giving up.
          curl -fsSLO --retry 8 --retry-all-errors --retry-delay 15 --connect-timeout 30 \
            "https://thrysoee.dk/editline/$LIBEDIT.tar.gz"
          echo "$LIBEDIT_SHA256  $LIBEDIT.tar.gz" | sha256sum -c -
          tar -xzf "$LIBEDIT.tar.gz"
          cd "$LIBEDIT"
          ./configure --prefix="$RUNNER_TEMP/libedit" --disable-shared --enable-static --quiet
          make --quiet -j"$(nproc)"
          make --quiet install

      - name: Use libedit (Linux)
        if: runner.os == 'Linux'
        run: echo "PKG_CONFIG_PATH=$RUNNER_TEMP/libedit/lib/pkgconfig" >> "$GITHUB_ENV"

      # macOS's own libedit, in /usr/lib, provides the readline interface.
      # bison from Homebrew is not on PATH by default, and the one macOS
      # ships is too old for the grammar.
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      # The prefix does not matter: an installation that has been moved
      # finds its libraries next to its executables. libdir is set so that
      # the archive has lib/cupid and not lib/x86_64-linux-gnu/cupid.
      # Line editing is required, not auto: a release without it would
      # otherwise pass unnoticed. On Linux it is the static libedit above.
      - name: Configure
        run: meson setup build --prefix=/usr/local --libdir=lib -Dbuildtype=release -Dreadline=enabled -Dstatic-readline=${{ runner.os == 'Linux' }}

      - name: Build
        run: |
          ninja -C build
          version=$(meson introspect --projectinfo build | jq -r .version)
          echo "ARCHIVE=cupid-$version-${{ matrix.target }}" >> "$GITHUB_ENV"

      # The test job checks the archived installation.
      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Install
        run: |
          DESTDIR="$PWD/stage" meson install -C build --quiet
          mkdir out
          mv stage/usr/local "out/$ARCHIVE"

      - name: Strip
        working-directory: out/${{ env.ARCHIVE }}/bin
        run: strip cupid runcupid fficupid

      # strip invalidates the linker's ad-hoc signature.
      - name: Sign
        if: runner.os == 'macOS'
        working-directory: out/${{ env.ARCHIVE }}/bin
        run: codesign --force --sign - cupid runcupid fficupid

      # The binaries must only need glibc, the one library every
      # distribution has with a stable ABI. libedit (its soname differs
      # between distributions) and libtinfo (its symbol versions do) are
      # linked statically above and must not appear here.
      - name: Check shared libraries
        if: runner.os == 'Linux'
        working-directory: out/${{ env.ARCHIVE }}/bin
        run: |
          for exe in cupid runcupid fficupid; do
            needed=$(readelf -d "$exe" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
            printf '%s:\n%s\n' "$exe" "$needed"
            if grep -vxE 'libc\.so\.6|libm\.so\.6|libdl\.so\.2|ld-linux-.*\.so\.[0-9]+' <<< "$needed"; then
              echo "::error::unexpected shared library dependencies of $exe (above)"
              exit 1
            fi
          done

      # Only system libraries; e.g. no Homebrew readline.
      - name: Check shared libraries
        if: runner.os == 'macOS'
        working-directory: out/${{ env.ARCHIVE }}/bin
        run: |
          for exe in cupid runcupid fficupid; do
            needed=$(otool -L "$exe" | tail -n +2 | awk '{print $1}')
            printf '%s:\n%s\n' "$exe" "$needed"
            if grep -vE '^(/usr/lib/|/System/Library/)' <<< "$needed"; then
              echo "::error::unexpected shared library dependencies of $exe (above)"
              exit 1
            fi
          done

      - name: Archive
        working-directory: out
        run: tar -czf "../$ARCHIVE.tar.gz" "$ARCHIVE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  test:
    name: Test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.test-runner }}
    strategy: *strategy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-${{ matrix.target }}
          path: artifact

      # Somewhere other than the prefix it was built for.
      - name: Unpack
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf artifact/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          echo "CUPID=$(echo "$RUNNER_TEMP"/unpacked/cupid-*)" >> "$GITHUB_ENV"

      # Without CUPIDDIR or -P: the installation must find its own libraries.
      - name: Smoke test
        run: |
          unset CUPIDDIR
          printf 'main :: IO ()\nmain = putStrLn "hello"\n' > "$RUNNER_TEMP/Hello.hs"
          out=$("$CUPID/bin/runcupid" "$RUNNER_TEMP/Hello.hs")
          echo "$out"
          [ "$out" = hello ]

      - name: Test
        run: python3 tests/run-tests "$CUPID/bin/cupid" "$CUPID/bin/runcupid" "$CUPID/lib/cupid/packages/*" tests

  # build and test for Windows, built with MinGW-w64 against the UCRT. The
  # steps are those of build and test, but with native Windows programs
  # only, from PowerShell with a PATH of nothing else: MSYS2 provides the
  # UCRT64 gcc, Python, meson and ninja, which are Windows programs, but not
  # its shell or any Unix tool, and bison is WinFlexBison's win_bison. The
  # bash of the other jobs would be Git's, a Unix layer.
  build-windows:
    name: Build x86_64-windows
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      # The expected outputs of the tests are compared byte for byte
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Install WinFlexBison
        run: |
          $zip = "$env:RUNNER_TEMP\win_flex_bison.zip"
          Invoke-WebRequest -OutFile $zip -Uri https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '8D324B62BE33604B2C45AD1DD34AB93D722534448F55A16CA7292DE32B6AC135') {
            throw "$zip does not have the expected SHA-256"
          }
          Expand-Archive $zip "$env:RUNNER_TEMP\win_flex_bison"

      # win_bison must run from its own directory, which holds its data
      - name: Make a PATH of native programs only
        run: |
          $dirs = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin",
                  "$env:RUNNER_TEMP\win_flex_bison",
                  "$env:SystemRoot\System32", "$env:SystemRoot",
                  "$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Add-Content $env:GITHUB_ENV "NATIVE_PATH=$($dirs -join ';')"

      # As for the other targets, the prefix does not matter: an
      # installation that has been moved finds its libraries next to its
      # executables.
      - name: Configure
        run: |
          $env:PATH = $env:NATIVE_PATH
          meson setup build --prefix=C:/cupid -Dbuildtype=release

      - name: Build
        run: |
          $env:PATH = $env:NATIVE_PATH
          ninja -C build
          $version = (meson introspect --projectinfo build | ConvertFrom-Json).version
          Add-Content $env:GITHUB_ENV "ARCHIVE=cupid-$version-x86_64-windows"

      # The test job checks the archived installation.
      - name: Test
        run: |
          $env:PATH = $env:NATIVE_PATH
          meson test -C build --print-errorlogs

      - name: Install
        run: |
          $env:PATH = $env:NATIVE_PATH
          $env:DESTDIR = "$PWD\stage"
          meson install -C build --quiet
          New-Item -ItemType Directory out | Out-Null
          Move-Item stage\cupid "out\$env:ARCHIVE"

      - name: Strip
        working-directory: out/${{ env.ARCHIVE }}/bin
        run: |
          $env:PATH = $env:NATIVE_PATH
          strip cupid.exe runcupid.exe fficupid.exe

      # Only the DLLs of Windows itself: the C runtime is the UCRT, which
      # Windows 10 and later have, and the line editor is linked in.
      - name: Check DLLs
        working-directory: out/${{ env.ARCHIVE }}/bin
        run: |
          $env:PATH = $env:NATIVE_PATH
          $bad = $false
          foreach ($exe in 'cupid.exe', 'runcupid.exe', 'fficupid.exe') {
            $dlls = objdump -p $exe | Select-String 'DLL Name: (\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
            "${exe}:"; $dlls
            $other = $dlls | Where-Object { $_ -notmatch '^(KERNEL32|api-ms-win-crt-[a-z0-9-]+)\.dll$' }
            if ($other) { "::error::unexpected DLL dependencies of ${exe}: $($other -join ', ')"; $bad = $true }
          }
          if ($bad) { exit 1 }

      - name: Archive
        working-directory: out
        run: Compress-Archive -Path $env:ARCHIVE -DestinationPath "..\$env:ARCHIVE.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-x86_64-windows
          path: ${{ env.ARCHIVE }}.zip
          if-no-files-found: error

  test-windows:
    name: Test x86_64-windows
    needs: build-windows
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-x86_64-windows
          path: artifact

      # run-tests is Python, and compiles its helper programs with gcc
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python

      - name: Make a PATH of native programs only
        run: |
          $dirs = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin",
                  "$env:SystemRoot\System32", "$env:SystemRoot",
                  "$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Add-Content $env:GITHUB_ENV "NATIVE_PATH=$($dirs -join ';')"

      # Somewhere other than the prefix it was built for.
      - name: Unpack
        run: |
          Expand-Archive (Get-Item artifact\*.zip) "$env:RUNNER_TEMP\unpacked"
          $dir = (Get-Item "$env:RUNNER_TEMP\unpacked\cupid-*").FullName
          Add-Content $env:GITHUB_ENV "CUPID=$dir"

      # Without CUPIDDIR or -P: the installation must find its own libraries.
      - name: Smoke test
        run: |
          $env:PATH = $env:NATIVE_PATH
          Remove-Item Env:CUPIDDIR -ErrorAction SilentlyContinue
          Set-Content "$env:RUNNER_TEMP\Hello.hs" "main :: IO ()`nmain = putStrLn `"hello`""
          $out = & "$env:CUPID\bin\runcupid.exe" "$env:RUNNER_TEMP\Hello.hs"
          $out
          if ($out -ne 'hello') { exit 1 }

      - name: Test
        run: |
          $env:PATH = $env:NATIVE_PATH
          python tests/run-tests "$env:CUPID\bin\cupid.exe" "$env:CUPID\bin\runcupid.exe" "$env:CUPID\lib\cupid\packages\*" tests

  # The source distribution, as meson dist makes it: a git archive of the
  # commit, which has every file that the build needs. The build and test
  # jobs build from the same commit, so --no-tests.
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build bison

      - name: Make the source distribution
        run: |
          meson setup build
          meson dist -C build --no-tests --formats gztar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: build/meson-dist/*.tar.gz
          if-no-files-found: error

  # Every commit of a PR must follow Conventional Commits, with a type that a
  # commit parser in cliff.toml knows: the release task reads them to choose
  # the next version and to write CHANGELOG.md. git-cliff checks the PR's
  # commits with cliff.toml, without the filters that drop unconventional and
  # unmatched commits from the changelog, and fails on either kind.
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          # The same version as in mise.toml.
          version: v2.14.2
          args: --verbose origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}
        env:
          GIT_CLIFF__GIT__FILTER_UNCONVENTIONAL: "false"
          GIT_CLIFF__GIT__FILTER_COMMITS: "false"
          GIT_CLIFF__GIT__REQUIRE_CONVENTIONAL: "true"
          GIT_CLIFF__GIT__FAIL_ON_UNMATCHED_COMMIT: "true"

  # The one check that the ruleset requires: whatever the matrix becomes, it
  # fails if any job it needs failed or was cancelled. Without always(), a
  # failed job would make it skipped, and GitHub treats a skipped required
  # check as passed. commits is skipped on pushes to main, which is fine.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [configurations, warnings, format, build, test, build-windows, test-windows, sdist, commits]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Publishes a release when the head of main is a release commit
  # ("chore(release): VERSION"). It is idempotent: a rerun continues a draft,
  # or does nothing if the release is published.
  release:
    name: release
    needs: ci-ok
    # The implicit success() would also look at commits, which is skipped on
    # pushes, and so skip this job too. Check ci-ok's result instead.
    if: >-
      !cancelled() && needs.ci-ok.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'chore(release): ')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE "s/^  version: '([^']*)',\$/\1/p" meson.build)
          subject=$(git log -1 --format=%s)
          # A squash merge appends " (#123)" to the subject.
          if [[ $subject != "chore(release): $version" && $subject != "chore(release): $version (#"*")" ]]; then
            echo "::error::The release commit \"$subject\" does not match version $version in meson.build"
            exit 1
          fi
          state=$(gh release view "v$version" --json isDraft \
                    --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          echo "v$version: $state"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"

      - name: Download release archives
        if: steps.plan.outputs.state != 'published'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Download the source distribution
        if: steps.plan.outputs.state != 'published'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist

      - name: Make checksums and release notes
        if: steps.plan.outputs.state != 'published'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Attest build provenance
        if: steps.plan.outputs.state != 'published'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Create the draft release
        if: steps.plan.outputs.state == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file NOTES.md

      - name: Upload and publish
        if: steps.plan.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # The release is a draft here, so --clobber is safe on a rerun.
          gh release upload "$TAG" dist/* --clobber
          # Publishing creates the tag and locks the tag and the assets.
          gh release edit "$TAG" --draft=false --latest
