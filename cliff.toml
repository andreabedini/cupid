[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and versions follow [Semantic Versioning](https://semver.org/), as described in
[Make a release](docs/contributing/make-a-release.md).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/andreabedini/cupid\
                /compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/andreabedini/cupid\
                /releases/tag/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/andreabedini/cupid\
            /compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
# The history before 14 October 2026 has plain subjects, and stays out.
filter_unconventional = true
filter_commits = true
# Keep breaking commits even when a commit parser below skips them.
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# Assign commits to the groups of Keep a Changelog. The comments order the
# groups in CHANGELOG.md. A breaking change of a type that is otherwise
# skipped, such as refactor!, goes to "Changed".
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^fix",  group = "<!-- 2 -->Fixed" },
  { field = "breaking", pattern = "true", group = "<!-- 1 -->Changed" },
  { message = "^(docs|ci|test|refactor|build|chore|style|revert)", skip = true },
]
# Order releases by tag date, not topologically.
topo_order = false
sort_commits = "oldest"

# .mise/tasks/release-pr takes the next version from `git cliff
# --bumped-version`. While the version is 0.x, a breaking change and feat
# both bump the minor version and fix and perf bump the patch version, so
# no change leaves 0.x by itself: 1.0.0 is set by hand. From 1.0.0 on,
# SemVer: breaking bumps major, feat minor, fix and perf patch.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
# The version of the first release, when there is no tag yet.
initial_tag = "v0.1.0"
